<script>

        { q: "Di tengah pelaksanaan tugas pelayanan lapangan, peralatan utama kerja mengalami kerusakan mendadak. Langkah pertama Anda adalah...", opts: [{t: "Tetap tenang, menggunakan opsi peralatan cadangan atau mekanisme manual agar pelayanan berjalan.", s: 5}, {t: "Melaporkan kerusakan pada teknisi dan menghentikan layanan sementara.", s: 3}, {t: "Menghubungi unit kerja terdekat untuk meminjam fasilitas peralatan kerja.", s: 4}, {t: "Menunggu instruksi atasan mengenai tindak lanjut penggunaan alat.", s: 2}, {t: "Menyalahkan bagian pemeliharaan atas kelalaian perawatan peralatan.", s: 1}] },

        { q: "Seorang rekan kerja sering mengunggah opini pribadi di media sosial yang menyudutkan kebijakan resmi tempat Anda bekerja. Sikap Anda adalah...", opts: [{t: "Menegurnya secara pribadi dan mengingatkan kode etik serta norma perilaku pegawai.", s: 5}, {t: "Melaporkan aktivitas media sosial rekan tersebut kepada komite etika instansi.", s: 4}, {t: "Membicarakan hal tersebut dengan rekan-rekan lain dalam kelompok kerja.", s: 3}, {t: "Mengabaikannya karena menganggap hal tersebut hak kebebasan berpendapat pribadi.", s: 2}, {t: "Memberikan komentar sanggahan secara terbuka pada unggahan media sosialnya.", s: 1}] },
        { q: "Saat mengalokasikan anggaran program bakti publik yang terbatas, langkah optimasi yang Anda ambil adalah...", opts: [{t: "Menyusun perencanaan efisien, memprioritaskan kebutuhan vital, dan menggalang kolaborasi yang sah.", s: 5}, {t: "Mengajukan permohonan iuran sukarela dari internal anggota tim pelaksana.", s: 4}, {t: "Mengurangi target sasaran penerima manfaat program publik.", s: 3}, {t: "Mengajukan penambahan dana darurat kepada pimpinan tanpa merubah alokasi draf.", s: 2}, {t: "Melaksanakan kegiatan seadanya sesuai batas anggaran minimal yang tersedia.", s: 1}] },
        { q: "Seorang pemohon izin mengajukan permohonan dengan satu dokumen pendukung yang belum memenuhi format standar. Tindakan Anda adalah...", opts: [{t: "Menjelaskan kekurangannya secara spesifik dan memberi petunjuk perbaikan agar cepat dilengkapi.", s: 5}, {t: "Berkonsultasi dengan pimpinan apakah dokumen tersebut dapat diberikan diskresi.", s: 4}, {t: "Menolak berkas permohonan tersebut dan memintanya mengulang proses dari awal.", s: 3}, {t: "Membiarkan berkas tersebut tertahan hingga pemohon menanyakan kembali.", s: 2}, {t: "Langsung meloloskan berkas tersebut demi mengedepankan kemudahan pemohon.", s: 1}] },
        { q: "Saat bertugas melakukan verifikasi di lapangan, Anda mendapatkan ancaman verbal dari oknum warga agar menyetujui laporan tertentu. Sikap Anda adalah...", opts: [{t: "Tetap tenang, berpegang teguh pada aturan SOP, dan berkoordinasi dengan tim pengamanan lokasi.", s: 5}, {t: "Menghubungi pimpinan langsung untuk melaporkan hambatan ancaman di lapangan.", s: 4}, {t: "Menghentikan proses verifikasi dan segera meninggalkan lokasi pemeriksaan.", s: 2}, {t: "Merekam aksi ancaman tersebut sebagai bahan bukti pelaporan hukum.", s: 3}, {t: "Melayani perdebatan oknum tersebut agar tidak dianggap takut.", s: 1}] },
        { q: "Berapa sering Anda melakukan refleksi dan evaluasi terhadap kualitas penyelesaian tugas kedinasan harian Anda?", opts: [{t: "Secara konsisten di akhir tugas untuk mengidentifikasi potensi perbaikan dan keakuratan kerja.", s: 5}, {t: "Melakukan evaluasi berkala bersama tim dalam sesi rapat internal mingguan.", s: 4}, {t: "Melakukan evaluasi jika ada waktu senggang di luar jam sibuk.", s: 3}, {t: "Melakukan evaluasi hanya apabila hasil kerja mendapat teguran dari atasan.", s: 2}, {t: "Jarang melakukan evaluasi karena menganggap pekerjaan sudah rutin sesuai standar.", s: 1}] },
        { q: "Anda diminta membimbing pegawai baru yang belum memiliki pengalaman kerja di bidang pelayanan publik. Langkah Anda adalah...", opts: [{t: "Menyusun panduan bimbingan bertahap, memberikan arahan jelas, dan memantau perkembangannya.", s: 5}, {t: "Menyerahkan proses bimbingan pegawai baru kepada staf senior lainnya.", s: 4}, {t: "Meminta pegawai baru mempelajari alur kerja secara mandiri dengan mengamati sekitar.", s: 3}, {t: "Memberikan tugas-tugas ringan terlebih dahulu tanpa perlu penjelasan rinci.", s: 2}, {t: "Langsung memberikan tugas berat untuk menguji ketahanan dan kapasitas kerjanya.", s: 1}] },
        { q: "Seorang anggota kelompok kerja Anda sering terlambat menyelesaikan bagian tugasnya sehingga menghambat laporan tim. Tindakan Anda adalah...", opts: [{t: "Mengajaknya berdiskusi secara personal, menanyakan kendala kerja, dan menegaskan komitmen tim.", s: 5}, {t: "Melaporkan perilaku keterlambatan tersebut kepada pejabat penilai kedisiplinan.", s: 4}, {t: "Membantu menyelesaikan bagian tugas anggota tersebut agar laporan tim tepat waktu.", s: 3}, {t: "Menyindir perilakunya saat forum rapat kelompok kerja berlangsung.", s: 2}, {t: "Membiarkannya karena masalah kedisiplinan merupakan tanggung jawab atasan.", s: 1}] },
        { q: "Dalam menjaga prinsip Keterbukaan Informasi Publik (KIP), pandangan utama yang Anda pegang adalah...", opts: [{t: "Memberikan akses informasi publik secara transparan sesuai regulasi dengan tetap menjaga rahasia negara.", s: 5}, {t: "Mendorong penyelesaian setiap permohonan informasi melalui mekanisme kehumasan resmi.", s: 4}, {t: "Menyerahkan seluruh informasi yang diminta masyarakat demi asas keterbukaan.", s: 2}, {t: "Membatasi akses informasi publik untuk mencegah potensi penyalahgunaan data.", s: 1}, {t: "Menunggu putusan pengawasan sebelum membuka dokumen informasi publik.", s: 3}] },
        { q: "Anda harus menyelesaikan analisis data yang memerlukan konsentrasi tinggi di lingkungan kerja yang bising. Cara Anda mengatasinya adalah...", opts: [{t: "Menjaga fokus, menyesuaikan diri dengan situasi, atau menggunakan ruang kerja yang lebih tenang.", s: 5}, {t: "Mencari ruangan lain yang kosong di area kantor untuk melanjutkan pengerjaan analisis.", s: 4}, {t: "Menunda pengerjaan tugas analisis sampai kondisi ruangan kembali tenang.", s: 3}, {t: "Menegur rekan-rekan yang membuat kebisingan dengan nada tegas.", s: 2}, {t: "Mengeluhkan kondisi ruang kerja kepada unit pengelola sarana prasarana.", s: 1}] },
        { q: "Bagaimana tindakan Anda jika melihat rekan sekerja menggunakan fasilitas mobil dinas untuk keperluan mudik keluarga?", opts: [{t: "Mengingatkan secara baik-baik bahwa aset dinas dilarang dipergunakan untuk kepentingan pribadi.", s: 5}, {t: "Melaporkan indikasi penyalahgunaan aset tersebut kepada bagian pengawasan internal.", s: 4}, {t: "Menyindir perilaku rekan tersebut di dalam grup pertemanan kantor.", s: 3}, {t: "Membiarkannya karena menganggap hal itu merupakan tanggung jawab pribadinya.", s: 1}, {t: "Meminta izin untuk ikut memanfaatkan fasilitas tersebut jika ada kesempatan.", s: 2}] },
        { q: "Saat memimpin kegiatan pelayanan luar kantor, terjadi cuaca buruk ekstrim yang mengganggu lokasi acara. Tindakan Anda adalah...", opts: [{t: "Mengutamakan keselamatan peserta dan tim, mengaktifkan rencana darurat, serta berkoordinasi dengan pihak terkait.", s: 5}, {t: "Menunggu petunjuk arahan dari komando pusat sebelum mengambil keputusan penundaan.", s: 4}, {t: "Membatalkan seluruh rangkaian kegiatan dan mengarahkan peserta kembali.", s: 3}, {t: "Meminta tim dan peserta berteduh sampai cuaca mereda tanpa kejelasan durasi.", s: 2}, {t: "Melanjutkan kegiatan pelayanan sesuai jadwal awal walau ada cuaca buruk.", s: 1}] },
        { q: "Bagaimana cara Anda dalam menerapkan core values ASN (BerAKHLAK) dalam pelaksanaan tugas sehari-hari?", opts: [{t: "Menjadikan norma etika, integritas, dan aturan hukum sebagai pedoman utama dalam berorientasi pelayanan.", s: 5}, {t: "Berusaha konsisten antara perkataan dan perbuatan serta memberikan teladan kerja.", s: 4}, {t: "Menerapkan nilai-nilai BerAKHLAK terutama saat berada di lingkungan pelayanan publik.", s: 3}, {t: "Menerapkan nilai organisasi sejauh hal tersebut mendukung pencapaian karier.", s: 1}, {t: "Mengikuti contoh budaya kerja yang ditunjukkan oleh senior dan pimpinan.", s: 2}] },
        { q: "Ketika proyek tim yang Anda pimpin meraih penghargaan tingkat nasional, sikap Anda adalah...", opts: [{t: "Menerima penghargaan dengan rendah hati dan menegaskan bahwa ini adalah hasil kerja keras seluruh tim.", s: 5}, {t: "Mengusulkan pembagian apresiasi bonus secara proporsional kepada seluruh anggota tim.", s: 4}, {t: "Menerima pujian tersebut sebagai bentuk pengakuan atas kapasitas kepemimpinan Anda.", s: 2}, {t: "Menolak penyerahan penghargaan karena merasa hasil proyek masih perlu disempurnakan.", s: 3}, {t: "Merayakan keberhasilan proyek bersama pejabat penanggung jawab kegiatan.", s: 1}] },
        { q: "Anda menemukan hambatan pada metode analisis data laporan yang belum pernah ditemui sebelumnya. Langkah Anda adalah...", opts: [{t: "Mencari pedoman teknis terbaru, berkonsultasi dengan senior/ahli, dan memecahkannya secara analitis.", s: 5}, {t: "Mengikuti program pelatihan mandiri singkat terkait metode analisis data tersebut.", s: 4}, {t: "Mencoba spekulasi formulasi secara mandiri sampai laporan terlihat selesai.", s: 1}, {t: "Mengalihkan pengerjaan bagian yang rumit tersebut kepada rekan kerja yang lebih mahir.", s: 3}, {t: "Melaporkan kepada atasan bahwa analisis laporan tidak dapat dilanjutkan.", s: 2}] },
        { q: "Seberapa jauh persiapan Anda sebelum melaksanakan tugas pengawasan ke wilayah perbatasan?", opts: [{t: "Mempelajari pemetaan kerawanan daerah, norma budaya warga lokal, serta kesiapan operasional.", s: 5}, {t: "Mendengarkan arahan briefing dari pimpinan sebelum keberangkatan ke wilayah perbatasan.", s: 4}, {t: "Mempersiapkan fisik dan kelengkapan perlengkapan standar dinas saja.", s: 3}, {t: "Langsung menuju lokasi penugasan dan mempelajari situasi secara fleksibel di lapangan.", s: 2}, {t: "Menyerahkan alur persiapan penugasan kepada koordinasi staf senior.", s: 1}] },
        { q: "Jika Anda dihadapkan pada pilihan menyelesaikan antrian berkas warga atau menghadiri rapat dinas non-mendesak, sikap Anda adalah...", opts: [{t: "Mengutamakan pelayanan warga sambil berkoordinasi meminta izin rapat atau diwakilkan staf.", s: 5}, {t: "Melaporkan benturan agenda ini kepada pimpinan rapat untuk meminta keputusan petunjuk.", s: 4}, {t: "Membagi waktu dengan melayani sebagian warga lalu meninggalkan antrian untuk rapat.", s: 3}, {t: "Meninggalkan pelayanan antrian warga demi menghadiri rapat dinas tepat waktu.", s: 2}, {t: "Meminta warga datang kembali esok hari agar Anda fokus mengikuti rapat.", s: 1}] },
        { q: "Bagaimana Anda merespon penataan ulang struktur organisasi kantor yang menempatkan Anda di bawah pimpinan baru yang berkarakter tegas kaku?", opts: [{t: "Menerima penataan struktur dengan profesional dan beradaptasi cepat dengan gaya kerja pimpinan baru.", s: 5}, {t: "Mencari tahu preferensi kerja pimpinan baru dari rekan sejawat untuk mengantisipasi miskomunikasi.", s: 4}, {t: "Meminta penyesuaian peran melalui bantuan staf senior sebagai jembatan komunikasi.", s: 3}, {t: "Menjalankan tugas seadanya tanpa banyak melakukan interaksi di luar arahan formal.", s: 2}, {t: "Mengajukan keberatan atas pemindahan unit kerja baru kepada bagian kepegawaian.", s: 1}] },
        { q: "Anda menyaksikan tindakan perundungan verbal yang dilakukan seorang oknum pejabat terhadap staf junior. Sikap integritas Anda adalah...", opts: [{t: "Mendampingi staf junior untuk memberikan dukungan serta melaporkan dugaan pelanggaran etika ke pengawas.", s: 5}, {t: "Mengingatkan oknum pejabat secara pribadi di lain waktu agar menjaga norma etika kerja.", s: 4}, {t: "Menegur oknum pejabat tersebut secara langsung saat kejadian berlangsung.", s: 3}, {t: "Membicarakan kejadian tersebut dengan rekan kerja lain sebagai bahan pelajaran bersama.", s: 2}, {t: "Membiarkan kejadian tersebut karena tidak ingin terlibat perselisihan dengan pejabat.", s: 1}] },
        { q: "Menurut Anda, apa komitmen nilai tertinggi yang harus dipegang teguh oleh seorang ASN / Pelayan Publik dalam bertugas?", opts: [{t: "Memberikan pengabdian terbaik demi kepentingan masyarakat, bangsa, dan negara berbasis aturan hukum.", s: 5}, {t: "Menjaga nama baik dan citra keharuman instansi tempat bertugas dari berbagai benturan negatif.", s: 4}, {t: "Menjalankan seluruh arahan instruksi pimpinan secara patuh demi menjaga komando organisasi.", s: 3}, {t: "Bekerja secara cermat untuk mencapai jenjang karier dan kepangkatan jabatan yang optimal.", s: 2}, {t: "Menjalankan tugas secara aman dan lancar demi kesejahteraan keluarga pribadi.", s: 1}] }
    ];

    let currentQ = 0;
    let userAnswers = {};
    let timerInterval;

    window.addEventListener('DOMContentLoaded', () => {
        renderNav();
        loadQ(0);
        startTimer(60 * 60);
    });

    function loadQ(idx) {
        currentQ = idx;
        const qData = bankTKP[idx];
        document.getElementById('q-no').innerText = `Soal ${idx + 1} dari 50`;
        document.getElementById('q-text').innerText = qData.q;
        
        let html = '';
        qData.opts.forEach((opt, i) => {
            const isSelected = userAnswers[idx] === i ? 'selected' : '';
            html += `<div class="opt ${isSelected}" onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${opt.t}</div>`;
        });
        document.getElementById('options').innerHTML = html;
        document.getElementById('btn-next').innerText = idx === bankTKP.length - 1 ? "Selesai" : "Selanjutnya";
        renderNav();
    }

    function selectOpt(optIdx) {
        userAnswers[currentQ] = optIdx;
        loadQ(currentQ);
        // Autonext diaktifkan kembali
        setTimeout(() => { nextQ(); }, 250);
    }

    function renderNav() {
        let html = '';
        for(let i = 0; i < bankTKP.length; i++) {
            let cls = 'nav-item';
            if(userAnswers[i] !== undefined) cls += ' filled';
            if(i === currentQ) cls += ' active';
            html += `<div class="${cls}" onclick="loadQ(${i})">${i + 1}</div>`;
        }
        document.getElementById('navGrid').innerHTML = html;
    }

    function nextQ() {
        if(currentQ === bankTKP.length - 1) {
            if(confirm("Apakah Anda yakin ingin menyelesaikan Tes Kepribadian ini?")) finishTest();
            return;
        }
        loadQ(currentQ + 1);
    }

    function prevQ() {
        if(currentQ > 0) loadQ(currentQ - 1);
    }

    function startTimer(seconds) {
        let t = seconds;
        timerInterval = setInterval(() => {
            let m = Math.floor(t / 60);
            let s = t % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(--t < 0) {
                clearInterval(timerInterval);
                finishTest();
            }
        }, 1000);
    }

    function finishTest() {
        clearInterval(timerInterval);
        let totalSkor = 0;
        let maxSkor = bankTKP.length * 5;
        
        bankTKP.forEach((q, i) => {
            if(userAnswers[i] !== undefined) {
                totalSkor += q.opts[userAnswers[i]].s;
            }
        });
        
        const nilai100 = Math.round((totalSkor / maxSkor) * 100);
        localStorage.setItem('prc_nilai_kepribadian_2', nilai100);
        alert(`Tes Kepribadian Selesai!\nSkor Anda: ${nilai100} / 100 (Total Poin: ${totalSkor})`);
        window.location.href = 'index.html';
    }
</script>
