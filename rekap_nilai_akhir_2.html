            text-align: center;

  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 1): pilihan ini menyatakan «Mengikuti instruksi atasan karena merasa itu adalah tanggung jawab beliau.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 4): pilihan ini menyatakan «Menyerahkan proses verifikasi berkas peserta tersebut langsung kepada atasan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 3): pilihan ini menyatakan «Melaporkan kejadian ini kepada unit pengawas internal institusi secara tertulis.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 5): pilihan ini menyatakan «Menolak permintaan tersebut dengan sopan dan memberikan penjelasan aturan secara objektif kepada atasan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 2): pilihan ini menyatakan «Meloloskan berkas tersebut namun memberi catatan khusus kekurangan syaratnya.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 2): pilihan ini menyatakan «Memberikan teguran resmi agar staf tidak mencampuradukkan masalah pribadi dan pekerjaan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 5): pilihan ini menyatakan «Melakukan pendekatan empati pribadi, mendengarkan masalahnya, dan memberikan dukungan penyesuaian kerja.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 1): pilihan ini menyatakan «Membiarkannya hingga staf tersebut menyelesaikan masalah pribadinya sendiri.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 4): pilihan ini menyatakan «Mengarahkan staf untuk mengkonsultasikan masalahnya kepada konselor institusi.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 3): pilihan ini menyatakan «Memberikan keringanan waktu kerja tanpa batas hingga kondisi staf pulih.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",

  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 2): pilihan ini menyatakan «Melakukan evaluasi hanya jika hasil kinerja mendapatkan teguran dari atasan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 3): pilihan ini menyatakan «Melakukan evaluasi jika ada waktu senggang saja.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 5): pilihan ini menyatakan «Selalu secara rutin di akhir tugas untuk menemukan area pengembangan dan mencegah kesalahan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 4): pilihan ini menyatakan «Melakukan evaluasi bersama tim saat rapat berkala organisasi.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 1): pilihan ini menyatakan «Jarang melakukan evaluasi karena merasa pengerjaan tugas sudah sesuai prosedur.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",

  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 4): pilihan ini menyatakan «Melaporkan keterlambatannya secara langsung pada bagian kedisiplinan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 5): pilihan ini menyatakan «Mengajaknya berbicara secara personal, menanyakan kendala keterlambatannya, dan menegaskan dampaknya bagi tim.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 1): pilihan ini menyatakan «Acuh tak acuh karena urusan kedisiplinan adalah kewenangan atasan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 2): pilihan ini menyatakan «Menyindir perilakunya di depan forum anggota tim lainnya.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 3): pilihan ini menyatakan «Membantu mengerjakan porsi tugas anggota yang terlambat tersebut.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 1): pilihan ini menyatakan «Menutup rapat-rapat semua akses informasi institusi demi keamanan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 5): pilihan ini menyatakan «Mengedepankan keterbukaan informasi publik sesuai undang-undang dengan tetap menjaga rahasia negara.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 2): pilihan ini menyatakan «Menyerahkan seluruh berkas informasi yang diminta masyarakat tanpa filter kerahasiaan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 4): pilihan ini menyatakan «Mendorong penyelesaian sengketa melalui jalur musyawarah kehumasan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 3): pilihan ini menyatakan «Menunggu putusan pengadilan sebelum memberikan informasi apapun.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 2): pilihan ini menyatakan «Menegur rekan-rekan yang bising dengan nada tinggi.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 3): pilihan ini menyatakan «Menunda pengerjaan tugas analisis sampai situasi ruangan kembali tenang.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 4): pilihan ini menyatakan «Mencari ruangan kosong lain yang tenang di area kantor untuk melanjutkan kerja.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 5): pilihan ini menyatakan «Menjaga fokus pikiran, mengkondisikan ruang kerja sementara atau menggunakan penyumbat telinga.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 1): pilihan ini menyatakan «Mengeluhkan kondisi kebersihan dan ketertiban ruangan pada bagian rumah tangga kantor.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 4): pilihan ini menyatakan «Melaporkan tindakan penyalahgunaan aset tersebut ke pengawas.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 5): pilihan ini menyatakan «Mengingatkan secara baik-baik bahwa fasilitas kantor tidak boleh dipergunakan untuk kepentingan pribadi.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 1): pilihan ini menyatakan «Diam saja karena merasa itu bukan urusan pribadi saya.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 2): pilihan ini menyatakan «Ikut serta memanfaatkan fasilitas tersebut bila ada kesempatan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 3): pilihan ini menyatakan «Menyindir rekan tersebut di dalam grup pertemanan dinas.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 5): pilihan ini menyatakan «Mengutamakan keselamatan jiwa anggota tim, mengubah rencana ke opsi darurat, dan berkoordinasi dengan tim SAR.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 1): pilihan ini menyatakan «Meneruskan kegiatan utama meski risiko bahaya melingkupi anggota tim.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 3): pilihan ini menyatakan «Membatalkan seluruh rangkaian kegiatan dan langsung memerintahkan anggota kembali.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 4): pilihan ini menyatakan «Menunggu arahan instruksi komando pusat sebelum mengambil keputusan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 2): pilihan ini menyatakan «Memerintahkan anggota berteduh sampai banjir mereda tanpa batas waktu jelas.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",
  "Soal ini merupakan studi situasi/perilaku, bukan soal benar-salah. Pembahasan digunakan untuk memahami konteks keputusan dan perbedaan setiap alternatif. Skor pilihan dan urutannya mengikuti bank soal asli.\n\nA (skor 2): pilihan ini menyatakan «Menjaga integritas hanya ketika sedang mengenakan seragam dinas resmi.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nB (skor 5): pilihan ini menyatakan «Menjadikan norma etika dan kebenaran hukum sebagai pedoman utama dalam berperilaku, baik saat bertugas maupun di luar tugas.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nC (skor 1): pilihan ini menyatakan «Menerapkan nilai integritas sejauh hal tersebut tidak merugikan karier.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nD (skor 4): pilihan ini menyatakan «Selalu berusaha konsisten antara ucapan dan tindakan serta menjadi teladan.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.\nE (skor 3): pilihan ini menyatakan «Mengikuti instruksi dan budaya integritas yang berlaku di unit kerja.». Dalam konteks soal, pilihan tersebut menggambarkan respons/tindakan yang dipilih peserta pada situasi yang diberikan.",

    document.addEventListener("DOMContentLoaded", function () {
        const nama = localStorage.getItem("prc_nama_peserta");
        if (nama) document.getElementById("nama-peserta").textContent = "Nama: " + nama;

        function getScore(key) {
            const val = localStorage.getItem(key);
            if (val === null || val === undefined || String(val).trim() === "") return null;
            const parsed = parseFloat(val);
            return isNaN(parsed) ? null : parsed;
        }
        function formatNumber(num) { return Number(num.toFixed(2)).toString().replace(".", ","); }

        const kecerdasan = getScore("prc_nilai_kecerdasan_2");
        const kepribadian = getScore("prc_nilai_kepribadian_2");
        const kecermatan = getScore("prc_nilai_kecermatan_2");

        if (kecerdasan !== null) {
            document.getElementById("nilai-kecerdasan").textContent = formatNumber(kecerdasan);
            document.getElementById("bobot-kecerdasan").textContent = formatNumber(kecerdasan * 0.30);
            const stat=document.getElementById("status-kecerdasan"); stat.textContent="SELESAI"; stat.className="status-badge status-complete";
        }
        if (kepribadian !== null) {
            document.getElementById("nilai-kepribadian").textContent = formatNumber(kepribadian);
            document.getElementById("bobot-kepribadian").textContent = formatNumber(kepribadian * 0.30);
            const stat=document.getElementById("status-kepribadian"); stat.textContent="SELESAI"; stat.className="status-badge status-complete";
        }
        if (kecermatan !== null) {
            document.getElementById("nilai-kecermatan").textContent = formatNumber(kecermatan);
            document.getElementById("bobot-kecermatan").textContent = formatNumber(kecermatan * 0.40);
            const stat=document.getElementById("status-kecermatan"); stat.textContent="SELESAI"; stat.className="status-badge status-complete";
        }

        const elNilaiAkhir=document.getElementById("nilai-akhir");
        if(kecerdasan !== null && kepribadian !== null && kecermatan !== null) {
            const nilaiAkhir=(kecerdasan*0.30)+(kepribadian*0.30)+(kecermatan*0.40);
            elNilaiAkhir.textContent=formatNumber(nilaiAkhir);
            localStorage.setItem("prc_nilai_akhir_2", nilaiAkhir.toFixed(2));
        } else {
            elNilaiAkhir.textContent="BELUM LENGKAP";
        }
    });

    function openReview() {
        const panel=document.getElementById('reviewPanel');
        panel.style.display='block';
        panel.scrollIntoView({behavior:'smooth', block:'start'});
    }

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function statusClass(text) {
        if(text==='BENAR') return 'status-correct';
        if(text==='SALAH') return 'status-wrong';
        return 'status-unanswered';
    }

    function getKecerdasanAnswers() {
        try { return JSON.parse(localStorage.getItem('prc_review_kecerdasan_2_answers') || '{}'); } catch(e) { return {}; }
    }
    function getKepribadianAnswers() {
        try { return JSON.parse(localStorage.getItem('prc_review_kepribadian_2_answers') || '{}'); } catch(e) { return {}; }
    }
    function getKecermatanReview() {
        try { return JSON.parse(localStorage.getItem('prc_review_kecermatan_2') || '[]'); } catch(e) { return []; }
    }

    function renderKecerdasan() {
        const ans=getKecerdasanAnswers();
        let out='<div class="review-section"><div class="review-title">TES KECERDASAN — '+bankKecerdasan.length+' SOAL</div>';
        bankKecerdasan.forEach((q,i)=>{
            const selected=ans[i] !== undefined ? Number(ans[i]) : null;
            const key=Number(q.ans);
            const stat=selected===null?'BELUM DIJAWAB':(selected===key?'BENAR':'SALAH');
            out+=`<div class="review-item">
                <div class="review-question">Soal ${i+1}. ${esc(q.q)}</div>
                <div class="review-meta">Jawaban peserta: <b>${selected===null?'BELUM DIJAWAB':String.fromCharCode(65+selected)+'. '+esc(q.opts[selected])}</b></div>
                <div class="review-meta">Kunci jawaban: <b>${String.fromCharCode(65+key)}. ${esc(q.opts[key])}</b></div>
                <div class="${statusClass(stat)}">STATUS: ${stat}</div>
                ${q.opts.map((o,j)=>`<div class="review-option ${selected===j?'selected ':''}${key===j?'key':''}">${String.fromCharCode(65+j)}. ${esc(o)} ${selected===j?'— JAWABAN PESERTA':''} ${key===j?'— KUNCI':''}</div>`).join('')}
                <div class="review-explanation"><b>PEMBAHASAN:</b><br>${esc(pembahasanKecerdasan[i])}</div>
            </div>`;
        });
        return out+'</div>';
    }

    function renderKepribadian() {
        const ans=getKepribadianAnswers();
        let out='<div class="review-section"><div class="review-title">TES KEPRIBADIAN — '+bankTKP.length+' SOAL</div>';
        bankTKP.forEach((q,i)=>{
            const selected=ans[i] !== undefined ? Number(ans[i]) : null;
            const skor=selected===null?null:q.opts[selected].s;
            out+=`<div class="review-item">
                <div class="review-question">Soal ${i+1}. ${esc(q.q)}</div>
                <div class="review-meta">Jawaban peserta: <b>${selected===null?'BELUM DIJAWAB':String.fromCharCode(65+selected)+'. '+esc(q.opts[selected].t)}</b></div>
                <div class="review-meta">Skor pilihan peserta: <b>${skor===null?'—':skor}</b></div>
                ${q.opts.map((o,j)=>`<div class="review-option ${selected===j?'selected':''}">${String.fromCharCode(65+j)}. ${esc(o.t)} <b>(Skor ${o.s})</b>${selected===j?' — PILIHAN PESERTA':''}</div>`).join('')}
                <div class="review-explanation"><b>PENJELASAN:</b><br>${esc(pembahasanKepribadian[i])}</div>
            </div>`;
        });
        return out+'</div>';
    }

    function renderKecermatan() {
        const data=getKecermatanReview();
        let out='<div class="review-section"><div class="review-title">TES KECERMATAN — '+data.length+' PENGERJAAN TEREKAM</div>';
        if(!data.length) return out+'<div class="review-item">Belum ada data pengerjaan Kecermatan yang tersimpan.</div></div>';
        data.forEach((r,i)=>{
            const stat=!r.jawaban?'BELUM DIJAWAB':(r.jawaban===r.kunci?'BENAR':'SALAH');
            const acuan=(r.acuan||[]).map((x,j)=>`${String.fromCharCode(65+j)}:${esc(x)}`).join(' &nbsp; ');
            const soal=(r.soal||[]).map(x=>esc(x)).join(' ');
            out+=`<div class="review-item">
                <div class="review-question">Pengerjaan ${i+1} — Kolom ${esc(r.kolom)}</div>
                <div class="review-meta"><b>Acuan:</b></div><div class="pattern-box">${acuan}</div>
                <div class="review-meta"><b>Stimulus yang tampil:</b></div><div class="pattern-box">${soal}</div>
                <div class="review-meta">Jawaban peserta: <b>${esc(r.jawaban || 'BELUM DIJAWAB')}</b></div>
                <div class="review-meta">Kunci: <b>${esc(r.kunci)}</b></div>
                <div class="${statusClass(stat)}">STATUS: ${stat}</div>
                <div class="review-explanation"><b>PEMBAHASAN:</b><br>Stimulus terdiri dari empat simbol dari lima simbol acuan. Kunci ${esc(r.kunci)} menunjukkan posisi simbol acuan yang tidak muncul pada stimulus. Perhatikan seluruh simbol satu per satu, cocokkan dengan acuan A–E, lalu tentukan label posisi yang hilang. Strategi utama adalah menjaga urutan pemeriksaan tetap sistematis agar tidak ada simbol yang terlewat.</div>
            </div>`;
        });
        return out+'</div>';
    }

    function showReview(type) {
        openReview();
        let out='';
        if(type==='kecerdasan') out=renderKecerdasan();
        else if(type==='kepribadian') out=renderKepribadian();
        else if(type==='kecermatan') out=renderKecermatan();
        else out=renderKecerdasan()+renderKepribadian()+renderKecermatan();
        document.getElementById('reviewContent').innerHTML=out;
    }

    function resetSeries2() {
        if(!confirm("Yakin ingin menghapus seluruh data TRYOUT SERIES 2 dan mulai dari nol? Data project lain tidak akan dihapus.")) return;
        [
            'prc_nama_peserta',
            'prc_nilai_kecerdasan_2',
            'prc_nilai_kepribadian_2',
            'prc_nilai_kecermatan_2',
            'prc_nilai_akhir_2',
            'prc_review_kecerdasan_2_answers',
            'prc_review_kepribadian_2_answers',
            'prc_review_kecermatan_2'
        ].forEach(k=>localStorage.removeItem(k));
        window.location.href='index.html';
    }
</script>
